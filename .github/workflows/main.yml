name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libssl-dev libffi-dev python3-dev zip unzip openjdk-17-jdk lld autoconf libtool ccache
        pip install --upgrade pip
        pip install "Cython==0.29.36" buildozer

    - name: Build APK with Buildozer
      run: |
        buildozer init
        sed -i 's/#warn_on_root = 1/warn_on_root = 0/' buildozer.spec
        # التأكد من تعيين إصدار Kivy و Cython داخل buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3,kivy==2.2.1/' buildozer.spec
        yes | buildozer -v android debug --accept-sdk-license

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: bin/*.apk
